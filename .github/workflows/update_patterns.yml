name: Sync Steam Pattern TOMLs

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  # push staging/ (放入新 DLL) 时自动触发
  push:
    paths:
      - 'staging/**'

permissions:
  contents: write

jobs:
  sync-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate pattern TOMLs
        run: python ci_sync.py

      - name: Commit and push
        run: |
          git config user.name "OpenSteamTool Bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          git status --short
          git add -A
          git commit -m "sync TOML(s): regenerate from staging DLLs ($(date -u '+%Y-%m-%d %H:%M'))"
          git push
