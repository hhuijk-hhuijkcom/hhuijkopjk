name: Sync Steam Pattern TOMLs

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  # push staging/ 目录时自动触发
  push:
    paths:
      - 'staging/**'

permissions:
  contents: write

jobs:
  sync-patterns:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pefile
        run: pip install pefile --quiet

      - name: "Fetch DLLs (release > staging)"
        id: fetch
        run: |
          New-Item -ItemType Directory -force -path dlls | Out-Null
          $dlls = @('steamclient.dll', 'steamclient64.dll', 'steamui.dll')
          $found = $false

          # --- 1a. 先查最新 Release ---
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -UseBasicParsing
            foreach ($dll in $dlls) {
              $asset = $release.assets | Where-Object { $_.name -eq $dll } | Select-Object -First 1
              if ($asset) {
                Write-Output "[Release] Downloading $dll from $($asset.browser_download_url)"
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "dlls\$dll" -UseBasicParsing
                $found = $true
              }
            }
          } catch {
            Write-Output "No release found: $_"
          }

          # --- 1b. Release 没有? 读 staging/ ---
          if (-not $found) {
            Write-Output "[Staging] Reading from staging/"
            foreach ($dll in $dlls) {
              if (Test-Path "staging\$dll") {
                Copy-Item "staging\$dll" "dlls\$dll" -force
                $found = $true
              }
            }
          }

          if (-not $found) {
            Write-Output "::warning::No Steam DLLs found in Release or staging/. Either upload a release asset or commit to staging/"
            $env:HAS_DLL = "false"
          } else {
            $env:HAS_DLL = "true"
          }

      - name: Generate pattern TOMLs
        if: env.HAS_DLL == 'true'
        run: |
          # 从上游 steam-monitor 抄最新 TOML 当 seed
          try {
            $upDir = "upstream_seed"
            New-Item -ItemType Directory -force -path $upDir, "$upDir\steamclient", "$upDir\steamui", "$upDir\ipc\steamclient" | Out-Null
            foreach ($sub in @('steamclient','steamui')) {
              try {
                $list = Invoke-RestMethod -Uri "https://api.github.com/repos/OpenSteam001/steam-monitor/contents/$sub?ref=pattern" -UseBasicParsing
                foreach ($item in $list) {
                  if ($item.name -match '\.toml$') {
                    Invoke-WebRequest -Uri $item.download_url -OutFile "$upDir\$sub\$($item.name)" -UseBasicParsing
                  }
                }
              } catch { Write-Output "skip upstream $sub" }
            }
          } catch { Write-Output "skip upstream fetch" }

          # 把 seed 拷到 pattern_updater.py 能找到的位置
          foreach ($src in @('upstream_seed')) {
            if (Test-Path $src) { Copy-Item -Recurse -force $src pattern_cache }
          }

          # 跑生成器
          foreach ($dll in @('dlls\steamclient.dll', 'dlls\steamclient64.dll', 'dlls\steamui.dll')) {
            if (-not (Test-Path $dll)) { continue }
            $name = [System.IO.Path]::GetFileName($dll)
            $component = if ($name -match 'steamui') { 'steamui' } else { 'steamclient' }
            Write-Output "=== Processing $name -> $component ==="
            python pattern_updater.py --dll $dll --component $component --out_dir "./output"
          }

      - name: Commit to main
        if: env.HAS_DLL == 'true'
        run: |
          if (-not (Test-Path "output")) { Write-Output "No output dir - skip"; exit 0 }
          git config user.name "OpenSteamTool Bot"
          git config user.email "bot@users.noreply.github.com"

          # 确保 main + 所有产物在同一个分支
          git checkout main

          foreach ($sub in @('steamclient','steamui')) {
            $srcDir = "output\pattern\$sub"
            if (-not (Test-Path $srcDir)) { continue }
            New-Item -ItemType Directory -force -path $sub | Out-Null
            Get-ChildItem $srcDir -filter *.toml | ForEach-Object {
              Copy-Item $_.FullName "$sub\$($_.Name)" -force
              Write-Output "  -> $sub\$($_.Name)"
            }
          }

          # IPC TOML 如果 upstream 抄到了, 也带上
          if (Test-Path "upstream_seed\ipc\steamclient") {
            New-Item -ItemType Directory -force -path "ipc\steamclient" | Out-Null
            Get-ChildItem "upstream_seed\ipc\steamclient" -filter *.toml | ForEach-Object {
              Copy-Item $_.FullName "ipc\steamclient\$($_.Name)" -force
            }
          }

          git add -A
          $count = (git diff --cached --name-only).Count
          Write-Output "Staged $count files"
          if ($count -gt 0) {
            git commit -m "sync TOML(s): $count files - steam auto-build $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push origin main
            Write-Output "Done"
          } else {
            Write-Output "Nothing to commit (fork is in sync)"
          }
