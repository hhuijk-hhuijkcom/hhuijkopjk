name: Update Pattern TOML

on:
  # 每天检查一次 Steam 更新
  schedule:
    - cron: '0 8 * * *'   # UTC 8:00 = 北京时间 16:00
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write

jobs:
  update-patterns:
    runs-on: windows-latest    # 需要 Windows 才能解析 PE 头
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 拉完整历史 (含所有分支)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pefile --quiet
        # 注: capstone 在 sig 自匹配里没用 (纯 pefile + struct 足够), 省了

      # === 下载 Steam DLL ===
      - name: Download latest steamclient64.dll
        run: |
          New-Item -ItemType Directory -Force -Path dlls | Out-Null
          # Steam 官方 CDN, 固定稳定版 URL
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamclient.dll" -OutFile "dlls\steamclient.dll"
          if (Test-Path "dlls\steamclient64.dll") { Remove-Item "dlls\steamclient64.dll" }
          # steamui.dll 随 Steam 主安装包走, CDN 上没有单独 URL
          # 如果 fork 里已有 seed, 可跳过 download steamui 这步

      # === 生成 pattern TOML ===
      - name: Run pattern updater (steamclient)
        run: |
          python pattern_updater.py --dll "dlls\steamclient.dll" --component steamclient --out_dir "./output"

      # === 提交到 pattern 分支 ===
      - name: Commit to pattern branch
        run: |
          $sha = (Get-FileHash "dlls\steamclient.dll" -Algorithm SHA256).Hash.ToLower()
          git config user.name "OpenSteamTool Bot"
          git config user.email "bot@users.noreply.github.com"

          # 先切到 pattern 分支 (不存在就从 main 新建)
          $branchExists = git branch --list pattern
          if (-not $branchExists) {
            git checkout -b pattern
          } else {
            git checkout pattern
            git pull origin pattern
          }

          $src = "output\pattern\steamclient\$sha.toml"
          if (Test-Path $src) {
            New-Item -ItemType Directory -Force -Path "steamclient" | Out-Null
            Copy-Item $src "steamclient\$sha.toml" -Force
            git add "steamclient\$sha.toml"
            git commit -m "pattern: steamclient64 $sha" || Write-Output "no changes"
            git push origin pattern || Write-Output "push failed (need auth?)"
          } else {
            Write-Output "No TOML generated — upstream may already have it"
          }
        continue-on-error: true
